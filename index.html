<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f28c28"><meta name="description" content="SHREE JI CONNECT - Customer CRM, Orders, Production, Reports, WhatsApp and Print">
<link rel="manifest" href="./manifest.json"><link rel="icon" type="image/png" href="./favicon.png"><link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>SHREE JI CONNECT</title>
<style>
:root{--orange:#f28c28;--orange2:#fff1e3;--dark:#171717;--bg:#f6f6f6;--line:#e8e8e8;--green:#168b58;--blue:#287dcc;--red:#d84b4b}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#171717}.top{height:74px;background:#111;color:#fff;display:flex;align-items:center;gap:12px;padding:10px 15px;position:sticky;top:0;z-index:40}.menu{font-size:28px;background:none;color:#fff;border:0;cursor:pointer}.logo{width:46px;height:46px;border-radius:50%;background:var(--orange);display:grid;place-items:center;font-weight:900;color:#111}.top b{font-size:16px}.top small{display:block;color:#ccc;margin-top:3px}.wrap{max-width:1180px;margin:auto;padding:16px 14px 55px}.side{position:fixed;left:0;top:0;bottom:0;width:min(310px,88vw);background:#fff;z-index:100;transform:translateX(-100%);transition:.22s;box-shadow:4px 0 25px #0003;padding:16px;overflow:auto}.side.open{transform:translateX(0)}.sideHead{display:flex;align-items:center;gap:10px;padding:8px 4px 18px;border-bottom:1px solid var(--line);margin-bottom:10px}.sideHead .logo{width:42px;height:42px}.sideHead b{font-size:14px}.sideHead small{display:block;color:#777;margin-top:3px}.sideClose{margin-left:auto;border:0;background:#eee;border-radius:50%;width:34px;height:34px;font-size:20px}.side button{display:block;width:100%;padding:13px;border:0;background:#fff;text-align:left;font-weight:700;border-radius:11px;margin:3px 0;font-size:15px}.side button:hover,.side button.active{background:var(--orange2);color:#c65d00}.overlay{display:none;position:fixed;inset:0;background:#0008;z-index:90}.overlay.show{display:block}.card{background:#fff;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 2px 14px #0000000c}.hero{display:flex;justify-content:space-between;gap:16px;align-items:center}.hero h2{margin:0 0 5px}.muted{color:#777}.actions{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:800;font-size:14px;cursor:pointer;background:#eee}.btn:hover{filter:brightness(.97)}.orange{background:var(--orange);color:#fff}.green{background:var(--green);color:#fff}.blue{background:var(--blue);color:#fff}.dark{background:#222;color:#fff}.red{background:var(--red);color:#fff}.small{padding:8px 10px;font-size:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.field{margin:10px 0}.field label{display:block;font-weight:800;margin-bottom:6px}.field input,.field select,.field textarea,.search{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:15px;background:#fff}.field textarea{min-height:100px;resize:vertical}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#fff;border-radius:16px;padding:15px}.stat b{font-size:23px;display:block;margin-bottom:4px}.stat span{color:#777;font-size:12px}.summary{overflow:hidden}.summary .tableWrap{overflow-x:auto}.summary table{width:100%;min-width:650px;border-collapse:collapse;font-size:13px}.summary th,.summary td{padding:12px 10px;border-bottom:1px solid #eee;text-align:center;white-space:nowrap}.summary th:first-child,.summary td:first-child{text-align:left}.summary thead th{font-size:11px;color:#777;text-transform:uppercase;background:#fafafa}.summary tbody tr:last-child{background:#fff7ef;font-weight:900}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px}.d{background:#74b83f}.s{background:#287dcc}.t{background:var(--orange)}.list{border:1px solid var(--line);border-radius:14px;padding:13px;margin:9px 0}.pill{display:inline-block;background:#eee;border-radius:20px;padding:5px 9px;font-size:11px;font-weight:800}.status-Pending{background:#fff0d9;color:#9a5b00}.status-Started,.status-Processing{background:#eaf2ff;color:#1d62a8}.status-Finished,.status-Completed,.status-Delivered{background:#e7f7ef;color:#14734a}.reportBox{border:1px solid var(--line);border-radius:15px;padding:14px}.reportBox h3{margin:0 0 10px}.big{font-size:21px;font-weight:900}.empty{text-align:center;color:#888;padding:28px}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:150;align-items:flex-end}.modal.show{display:flex}.box{background:#fff;width:100%;max-width:820px;margin:auto;border-radius:20px 20px 0 0;padding:18px;max-height:95vh;overflow:auto}.close{float:right;border:0;background:#eee;border-radius:50%;width:34px;height:34px;font-size:20px}.toast{display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:12px 16px;border-radius:10px;z-index:250;max-width:90%;text-align:center}.check{display:flex;gap:10px;align-items:center;border:1px solid var(--line);padding:10px;border-radius:10px;margin:6px 0}.check input{width:19px;height:19px}.preview{background:#fafafa;border:1px solid #eee;border-radius:10px;padding:12px;white-space:pre-wrap}.scanner{border:2px dashed #f2b26f;border-radius:15px;padding:15px;text-align:center;background:#fffaf5}.scanner img{max-width:100%;max-height:260px;border-radius:10px;margin-top:10px}.printSheet{background:#fff;padding:24px;border:1px solid #ddd}.printHead{display:flex;align-items:center;gap:12px;border-bottom:3px solid var(--orange);padding-bottom:12px;margin-bottom:15px}.printLogo{width:48px;height:48px;border-radius:50%;background:var(--orange);display:grid;place-items:center;font-weight:900}.printHead h1{margin:0;font-size:21px}.printHead p{margin:3px 0;color:#777}.printSheet table{width:100%;border-collapse:collapse;font-size:12px}.printSheet th,.printSheet td{border:1px solid #ccc;padding:7px;text-align:left}.printSheet th{background:#fff1e3}.printFoot{margin-top:14px;font-size:11px;color:#777}.hide{display:none!important}@media(max-width:720px){.grid2,.grid3,.grid4{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.hero{align-items:flex-start;flex-direction:column}.hero .actions{width:100%}.hero .btn{flex:1}.box{max-height:96vh}}
@media print{body{background:#fff}.top,.side,.overlay,.noPrint,#app>section.card:not(.printSheet){display:none!important}.wrap{padding:0;max-width:none}.printSheet{border:0;padding:0;box-shadow:none}.printHead{margin-top:0}}
</style>
</head>
<body>
<header class="top"><button class="menu" onclick="toggleSide()">☰</button><div class="logo">SJ</div><div><b>SHREE JI CONNECT</b><small>SHREE JI GOLD CREATOR LLP</small></div></header>
<div id="overlay" class="overlay" onclick="closeSide()"></div>
<aside id="side" class="side"><div class="sideHead"><div class="logo">SJ</div><div><b>SHREE JI CONNECT</b><small>Professional Business Database</small></div><button class="sideClose" onclick="closeSide()">×</button></div>
<button data-p="dashboard" onclick="page('dashboard')">🏠 Dashboard</button><button data-p="customers" onclick="page('customers')">👥 Customer CRM</button><button data-p="orders" onclick="page('orders')">📦 Order Management</button><button data-p="reports" onclick="page('reports')">📊 Database Reports</button><button data-p="whatsapp" onclick="page('whatsapp')">💬 WhatsApp Center</button><button data-p="templates" onclick="page('templates')">📝 Message Templates</button><button data-p="scanner" onclick="page('scanner')">📇 Visiting Card Scanner</button><button data-p="print" onclick="page('print')">🖨️ Print Center</button><button data-p="exhibitions" onclick="page('exhibitions')">🎪 Exhibitions</button><button data-p="backup" onclick="page('backup')">💾 Backup & Restore</button><button data-p="settings" onclick="page('settings')">⚙️ Settings</button></aside>
<div class="wrap"><main id="app"></main></div><div id="modal" class="modal"><div class="box"><button class="close" onclick="closeModal()">×</button><div id="form"></div></div></div><div id="toast" class="toast"></div>
<script>
const KEY='shree_ji_connect_final_v1';
const DEFAULT_TEMPLATES=[['Exhibition Invite','Dear {{name}},\n\nYou are warmly invited to visit SHREE JI GOLD CREATOR LLP at our exhibition.'],['Festival Greeting','Dear {{name}},\n\nWarm festival wishes from SHREE JI GOLD CREATOR LLP.'],['Stall Visit Thank You','Dear {{name}},\n\nThank you for visiting our stall. It was a pleasure meeting you.'],['Order Thank You','Dear {{name}},\n\nThank you for your valuable order {{orderNo}}.'],['Order Started','Dear {{name}},\n\nYour order {{orderNo}} has been started.\nStatus: {{status}}'],['Order Completed','Dear {{name}},\n\nYour order {{orderNo}} has been completed successfully.'],['Ready for Delivery','Dear {{name}},\n\nYour order {{orderNo}} is ready for delivery.'],['Delivery Update','Dear {{name}},\n\nUpdate for order {{orderNo}}: {{status}}.'],['Review Request','Dear {{name}},\n\nThank you for your order. We would appreciate your valuable feedback.'],['Repeat Order','Dear {{name}},\n\nWe would be happy to serve you again.'],['New Collection','Dear {{name}},\n\nOur new jewellery collection is now available.'],['Follow-up','Dear {{name}},\n\nJust following up regarding your order / enquiry.']].map(x=>({id:uid(),name:x[0],message:x[1]}));
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function blankDB(){return{customers:[],templates:DEFAULT_TEMPLATES,settings:{company:'SHREE JI GOLD CREATOR LLP'}}}
function load(){try{let d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.customers)){d.templates=Array.isArray(d.templates)&&d.templates.length?d.templates:DEFAULT_TEMPLATES;d.settings=d.settings||{company:'SHREE JI GOLD CREATOR LLP'};return d}}catch(e){}return blankDB()}
let DB=load();function save(){localStorage.setItem(KEY,JSON.stringify(DB))}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.style.display='block';clearTimeout(window.__toast);window.__toast=setTimeout(()=>x.style.display='none',1900)}
function toggleSide(){document.getElementById('side').classList.add('open');document.getElementById('overlay').classList.add('show')}function closeSide(){document.getElementById('side').classList.remove('open');document.getElementById('overlay').classList.remove('show')}
function page(p){closeSide();document.querySelectorAll('.side button[data-p]').forEach(b=>b.classList.toggle('active',b.dataset.p===p));({dashboard,customersPage,ordersPage,reportsPage,whatsappPage,templatesPage,scannerPage,printPage,exhibitionsPage,backupPage,settingsPage}[p]||dashboard)()}
function grams(v){let s=String(v??'').replace(/,/g,'').trim().toLowerCase();if(!s)return 0;let n=parseFloat(s);if(!Number.isFinite(n))return 0;return s.includes('kg')?n*1000:n}
function fmt(g){g=Number(g||0);return g>=1000?(g/1000).toFixed(3)+' kg':g.toFixed(3)+' g'}
function today(){return new Date().toISOString().slice(0,10)}
function allOrders(){return DB.customers.flatMap(c=>(c.orders||[]).map(o=>({...o,customerId:c.id,customerName:c.name,mobile:c.mobile,shop:c.shop,city:c.city}))).sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''))}
function finished(o){return ['Finished','Completed','Delivered'].includes(o.status)}
function totalWeight(os){return os.reduce((s,o)=>s+grams(o.weight||o.totalWeight),0)}function startedWeight(os){return os.reduce((s,o)=>s+grams(o.startedWeight||o.startWeight),0)}
function dashboard(){let os=allOrders(),d=os.filter(o=>o.orderType==='Direct'),sm=os.filter(o=>o.orderType==='SM');let finish=a=>a.filter(finished).length,pending=a=>a.filter(o=>!finished(o)).length;let row=(name,a,cl)=>`<tr><th><span class="dot ${cl}"></span>${name}</th><td>${a.length}</td><td>${fmt(totalWeight(a))}</td><td>${fmt(startedWeight(a))}</td><td>${finish(a)}</td><td>${pending(a)}</td></tr>`;document.getElementById('app').innerHTML=`<section class="card hero"><div><h2>Welcome to SHREE JI CONNECT 👋</h2><p class="muted">Customer, Order & Production Database</p></div><div class="actions"><button class="btn orange" onclick="openCustomer()">＋ Customer</button><button class="btn dark" onclick="newOrder()">＋ Order</button><button class="btn green" onclick="page('whatsapp')">💬 WhatsApp</button><button class="btn" onclick="page('print')">🖨️ Print</button></div></section><div class="stats"><div class="stat"><b>${DB.customers.length}</b><span>Customers</span></div><div class="stat"><b>${os.length}</b><span>Total Orders</span></div><div class="stat"><b>${fmt(totalWeight(os))}</b><span>Total Weight</span></div><div class="stat"><b>${pending(os)}</b><span>Pending</span></div></div><section class="card summary"><div class="actions" style="justify-content:space-between"><div><h2 style="margin:0">📊 Direct / SM Summary</h2><span class="muted">Production overview at a glance</span></div><span class="pill">LIVE</span></div><div class="tableWrap"><table><thead><tr><th>Type</th><th>Total Order</th><th>Weight</th><th>Start</th><th>Finish</th><th>Pending</th></tr></thead><tbody>${row('DIRECT',d,'d')}${row('SM',sm,'s')}${row('TOTAL',os,'t')}</tbody></table></div></section><section class="card"><h3 style="margin-top:0">🎪 Recent Exhibitions</h3>${expoMini(os)}</section><section class="card"><h3 style="margin-top:0">📦 Recent Orders</h3>${os.slice(0,5).map(orderCard).join('')||'<div class="empty">No orders yet.</div>'}</section>`}
function expoMini(os){let m={};os.forEach(o=>{let k=o.exhibition||'No Exhibition';m[k]=(m[k]||0)+1});let a=Object.entries(m).slice(0,5);return a.length?a.map(([k,v])=>`<div class="list"><b>🎪 ${esc(k)}</b> • ${v} order(s)</div>`).join(''):'<div class="empty">No exhibition data yet.</div>'}
function customersPage(){document.getElementById('app').innerHTML=`<section class="card"><div class="actions" style="justify-content:space-between"><h2 style="margin:0">👥 Customer CRM</h2><button class="btn orange" onclick="openCustomer()">＋ Add Customer</button></div><div class="field"><input id="cs" class="search" placeholder="Search name, mobile, shop, city or expo..." oninput="renderCustomers()"></div><div id="cl"></div></section>`;renderCustomers()}
function renderCustomers(){let q=(document.getElementById('cs')?.value||'').toLowerCase();let a=DB.customers.filter(c=>(c.name+' '+c.mobile+' '+c.shop+' '+c.city+' '+c.exhibition+' '+c.address).toLowerCase().includes(q));document.getElementById('cl').innerHTML=a.length?a.map(c=>`<div class="list"><div class="actions" style="justify-content:space-between"><div><h3 style="margin:0 0 5px">${esc(c.name)}</h3><div>📱 ${esc(c.mobile)} • 🏪 ${esc(c.shop||'-')}</div><div>📍 ${esc(c.city||'-')} • 🎪 ${esc(c.exhibition||'-')}</div></div><span class="pill">${(c.orders||[]).length} Orders</span></div>${c.notes?`<p class="muted">📝 ${esc(c.notes)}</p>`:''}<div class="actions" style="margin-top:9px"><button class="btn orange small" onclick="addOrder('${c.id}')">＋ Order</button><button class="btn green small" onclick="waOne('${c.id}')">💬 WhatsApp</button><button class="btn small" onclick="openCustomerHistory('${c.id}')">📋 History</button><button class="btn small" onclick="editCustomer('${c.id}')">✏️ Edit</button><button class="btn red small" onclick="deleteCustomer('${c.id}')">🗑 Delete</button></div></div>`).join(''):'<div class="empty">No customers found.</div>'}
function openCustomer(id=null){let c=id?DB.customers.find(x=>x.id===id):null;document.getElementById('form').innerHTML=`<h2>${c?'✏️ Edit Customer':'👤 Add Customer'}</h2><div class="actions"><button class="btn" onclick="page('scanner');toast('Use camera to scan the visiting card')">📇 Scan Visiting Card</button></div><div class="field"><label>Party / Customer Name *</label><input id="cn" value="${esc(c?.name||'')}"></div><div class="grid2"><div class="field"><label>WhatsApp Number *</label><input id="cm" inputmode="tel" value="${esc(c?.mobile||'')}"></div><div class="field"><label>Shop / Company</label><input id="cshop" value="${esc(c?.shop||'')}"></div></div><div class="grid2"><div class="field"><label>City</label><input id="ccity" value="${esc(c?.city||'')}"></div><div class="field"><label>Address</label><input id="caddress" value="${esc(c?.address||'')}"></div></div><div class="field"><label>Exhibition / Source</label><input id="cexpo" value="${esc(c?.exhibition||'')}" placeholder="Manual entry"></div><div class="field"><label>Notes</label><textarea id="cnotes">${esc(c?.notes||'')}</textarea></div><div class="actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn orange" onclick="${c?`updateCustomer('${c.id}')`:'saveCustomer()'}">${c?'Save Changes':'Save Customer'}</button></div>`;showModal()}
function saveCustomer(){if(!cn.value.trim()||!cm.value.trim())return toast('Name and WhatsApp number are required');DB.customers.push({id:uid(),name:cn.value.trim(),mobile:cm.value.trim(),shop:cshop.value.trim(),city:ccity.value.trim(),address:caddress.value.trim(),exhibition:cexpo.value.trim(),notes:cnotes.value.trim(),orders:[],followups:[],createdAt:new Date().toISOString()});save();closeModal();customersPage();toast('Customer saved ✓')}
function updateCustomer(id){let c=DB.customers.find(x=>x.id===id);if(!c)return;c.name=cn.value.trim();c.mobile=cm.value.trim();c.shop=cshop.value.trim();c.city=ccity.value.trim();c.address=caddress.value.trim();c.exhibition=cexpo.value.trim();c.notes=cnotes.value.trim();save();closeModal();customersPage();toast('Customer updated ✓')}
function editCustomer(id){openCustomer(id)}function deleteCustomer(id){if(!confirm('Delete this customer and all order history?'))return;DB.customers=DB.customers.filter(c=>c.id!==id);save();renderCustomers();toast('Customer deleted')}
function addOrder(id){let c=DB.customers.find(x=>x.id===id);if(c)orderForm(c)}
function newOrder(){if(!DB.customers.length)return toast('Add a customer first');selectCustomerForOrder()}
function selectCustomerForOrder(){document.getElementById('form').innerHTML=`<h2>📦 Select Party</h2><div class="field"><input id="partySearch" class="search" placeholder="Search customer..." oninput="renderPartyPicker()"></div><div id="partyPicker"></div>`;showModal();renderPartyPicker()}
function renderPartyPicker(){let q=(document.getElementById('partySearch')?.value||'').toLowerCase(),a=DB.customers.filter(c=>(c.name+' '+c.mobile+' '+c.shop).toLowerCase().includes(q));document.getElementById('partyPicker').innerHTML=a.map(c=>`<button class="btn" style="width:100%;text-align:left;margin:4px 0" onclick="closeModal();addOrder('${c.id}')">👤 ${esc(c.name)} — ${esc(c.mobile)}</button>`).join('')||'<div class="empty">No customer found.</div>'}
function orderForm(c,oid=null){let o=oid?(c.orders||[]).find(x=>x.id===oid):null;document.getElementById('form').innerHTML=`<h2>📦 ${o?'Edit Order':'New Order'}</h2><p><b>${esc(c.name)}</b> • ${esc(c.mobile)}</p><div class="grid2"><div class="field"><label>Order Number *</label><input id="on" value="${esc(o?.orderNo||'')}" placeholder="Manual entry"></div><div class="field"><label>Expo</label><input id="oe" value="${esc(o?.exhibition||c.exhibition||'')}" placeholder="Manual entry"></div></div><div class="grid2"><div class="field"><label>Order Date</label><input id="odate" type="date" value="${esc(o?.orderDate||today())}"></div><div class="field"><label>Order Type</label><select id="ot"><option value="Direct" ${o?.orderType==='Direct'?'selected':''}>DIRECT — Our Supply</option><option value="SM" ${o?.orderType==='SM'?'selected':''}>SM — Dealer Supply</option></select></div></div><div class="grid2"><div class="field"><label>Weight</label><input id="ow" value="${esc(o?.weight||'')}" placeholder="Example: 500g"></div><div class="field"><label>Touch</label><input id="touch" value="${esc(o?.touch||'')}" placeholder="Example: 916"></div></div><div class="grid2"><div class="field"><label>Screw Type</label><input id="screw" value="${esc(o?.screw||'')}" placeholder="Screw / Hook"></div><div class="field"><label>Ring Size</label><div class="grid2"><select id="ringGender"><option value="Lady's" ${o?.ringGender==="Lady's"?'selected':''}>Lady's</option><option value="Gent's" ${o?.ringGender==="Gent's"?'selected':''}>Gent's</option></select><input id="ringSize" value="${esc(o?.ringSize||'')}" placeholder="Size"></div></div></div><div class="grid2"><div class="field"><label>HUID</label><input id="huid" value="${esc(o?.huid||'')}" placeholder="HUID"></div><div class="field"><label>Advance</label><div class="grid2"><select id="advType"><option value="GPay" ${o?.advanceType==='GPay'?'selected':''}>GPay</option><option value="Cash" ${o?.advanceType==='Cash'?'selected':''}>Cash</option></select><input id="adv" value="${esc(o?.advance||'')}" placeholder="Amount / note"></div></div></div><div class="grid2"><div class="field"><label>Gold Received</label><input id="goldReceived" value="${esc(o?.goldReceived||'')}" placeholder="Example: 300g"></div><div class="field"><label>Started Weight</label><input id="sw" value="${esc(o?.startedWeight||'')}" placeholder="Optional"></div></div><div class="grid2"><div class="field"><label>Expected Finish</label><input id="expectedFinish" type="date" value="${esc(o?.expectedFinish||'')}"></div><div class="field"><label>Actual Finish</label><input id="actualFinish" type="date" value="${esc(o?.actualFinish||'')}"></div></div><div class="grid2"><div class="field"><label>Start Date</label><input id="startDate" type="date" value="${esc(o?.startDate||'')}"></div><div class="field"><label>Status</label><select id="ost">${['Pending','Started','Processing','Finished'].map(s=>`<option ${o?.status===s?'selected':''}>${s}</option>`).join('')}</select></div></div><div class="field"><label>Notes</label><textarea id="onotes">${esc(o?.notes||'')}</textarea></div><div class="actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn orange" onclick="saveOrder('${c.id}','${oid||''}')">${o?'Update Order':'Save Order'}</button></div>`;showModal()}
function saveOrder(cid,oid){let c=DB.customers.find(x=>x.id===cid);if(!c)return;if(!on.value.trim())return toast('Order Number is required');let old=oid?(c.orders||[]).find(x=>x.id===oid):null;let data={id:oid||uid(),orderNo:on.value.trim(),exhibition:oe.value.trim(),orderDate:odate.value,orderType:ot.value,weight:ow.value.trim(),touch:touch.value.trim(),screw:screw.value.trim(),ringGender:ringGender.value,ringSize:ringSize.value.trim(),huid:huid.value.trim(),advanceType:advType.value,advance:adv.value.trim(),goldReceived:goldReceived.value.trim(),startedWeight:sw.value.trim(),expectedFinish:expectedFinish.value,actualFinish:actualFinish.value,startDate:startDate.value,status:ost.value,notes:onotes.value.trim(),createdAt:old?.createdAt||new Date().toISOString()};c.orders=c.orders||[];if(oid){let i=c.orders.findIndex(x=>x.id===oid);if(i>=0)c.orders[i]=data}else c.orders.push(data);save();closeModal();ordersPage();toast('Order saved ✓')}

function printPage(){document.getElementById('app').innerHTML=`<section class="card"><h2>🖨️ Print Center</h2><p class="muted">Choose exactly what you want to print. No order value is shown.</p><div class="grid3"><div class="reportBox"><h3>📊 Reports</h3><button class="btn orange" onclick="printPageType('All')">All Orders</button><button class="btn" onclick="printPageType('Direct')">Direct Report</button><button class="btn" onclick="printPageType('SM')">SM Report</button></div><div class="reportBox"><h3>👤 Party</h3><select id="pc" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:9px"><option value="">Select Party</option>${DB.customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><button class="btn orange" style="margin-top:8px" onclick="printParty()">Print Party</button></div><div class="reportBox"><h3>🎪 Exhibition</h3><input id="pe" placeholder="Expo name" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:9px"><button class="btn orange" style="margin-top:8px" onclick="printExpo()">Print Expo</button></div></div><div class="reportBox" style="margin-top:12px"><h3>📦 Single Order</h3><select id="po" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:9px"><option value="">Select Order</option>${allOrders().map(o=>`<option value="${o.customerId}|${o.id}">${esc(o.orderNo)} — ${esc(o.customerName)}</option>`).join('')}</select><button class="btn orange" style="margin-top:8px" onclick="printSelectedOrder()">Print Order</button></div></section>`}
function printSelectedOrder(){let v=po.value.split('|');if(v.length!==2)return toast('Select an order');printSingleOrder(v[0],v[1])}
function printParty(){let c=DB.customers.find(x=>x.id===pc.value);if(!c)return toast('Select a party');let a=(c.orders||[]).map(o=>({...o,customerName:c.name,shop:c.shop})),d=reportSet(a);printPage('Party Report — '+c.name,`<p><b>Party:</b> ${esc(c.name)} &nbsp; <b>Shop:</b> ${esc(c.shop||'-')} &nbsp; <b>Mobile:</b> ${esc(c.mobile)}</p><p><b>Orders:</b> ${d.orders} &nbsp; <b>Weight:</b> ${fmt(d.weight)} &nbsp; <b>Start:</b> ${fmt(d.started)} &nbsp; <b>Finish:</b> ${d.finish} &nbsp; <b>Pending:</b> ${d.pending}</p><table><thead><tr><th>Order</th><th>Date</th><th>Type</th><th>Expo</th><th>Weight</th><th>Status</th></tr></thead><tbody>${a.map(o=>`<tr><td>${esc(o.orderNo)}</td><td>${esc(o.orderDate||'-')}</td><td>${esc(o.orderType)}</td><td>${esc(o.exhibition||'-')}</td><td>${esc(o.weight||'-')}</td><td>${esc(o.status||'-')}</td></tr>`).join('')}</tbody></table>`)}
function printExpo(){let q=(pe.value||'').trim().toLowerCase();if(!q)return toast('Enter exhibition name');let a=allOrders().filter(o=>String(o.exhibition||'').toLowerCase().includes(q));if(!a.length)return toast('No orders for this exhibition');let d=reportSet(a);printPage('Exhibition Report — '+pe.value,`<p><b>Orders:</b> ${d.orders} &nbsp; <b>Weight:</b> ${fmt(d.weight)} &nbsp; <b>Start:</b> ${fmt(d.started)} &nbsp; <b>Finish:</b> ${d.finish} &nbsp; <b>Pending:</b> ${d.pending}</p><table><thead><tr><th>Party</th><th>Order</th><th>Type</th><th>Weight</th><th>Status</th></tr></thead><tbody>${a.map(o=>`<tr><td>${esc(o.customerName)}</td><td>${esc(o.orderNo)}</td><td>${esc(o.orderType)}</td><td>${esc(o.weight||'-')}</td><td>${esc(o.status||'-')}</td></tr>`).join('')}</tbody></table>`)}
function exhibitionsPage(){let m={};allOrders().forEach(o=>{let k=o.exhibition||'No Exhibition';m[k]??=[];m[k].push(o)});document.getElementById('app').innerHTML=`<section class="card"><h2>🎪 Exhibitions</h2><p class="muted">Every order keeps its Expo / source so owner can see where orders came from.</p>${Object.entries(m).map(([k,a])=>{let d=reportSet(a);return`<div class="reportBox" style="margin:9px 0"><div class="actions" style="justify-content:space-between"><b>🎪 ${esc(k)}</b><button class="btn orange small" onclick="printExpoByName('${encodeURIComponent(k)}')">🖨️ Print</button></div><p>Orders: <b>${d.orders}</b> • Weight: <b>${fmt(d.weight)}</b> • Start: <b>${fmt(d.started)}</b> • Finish: <b>${d.finish}</b> • Pending: <b>${d.pending}</b></p></div>`}).join('')||'<div class="empty">No exhibitions yet.</div>'}</section>`}
function printExpoByName(k){let v=decodeURIComponent(k);let a=allOrders().filter(o=>(o.exhibition||'No Exhibition')===v);let d=reportSet(a);printPage('Exhibition Report — '+v,`<p>Orders: ${d.orders} • Weight: ${fmt(d.weight)} • Start: ${fmt(d.started)} • Finish: ${d.finish} • Pending: ${d.pending}</p><table><thead><tr><th>Party</th><th>Order</th><th>Type</th><th>Weight</th><th>Status</th></tr></thead><tbody>${a.map(o=>`<tr><td>${esc(o.customerName)}</td><td>${esc(o.orderNo)}</td><td>${esc(o.orderType)}</td><td>${esc(o.weight||'-')}</td><td>${esc(o.status||'-')}</td></tr>`).join('')}</tbody></table>`)}
function followups(){let a=[];DB.customers.forEach(c=>(c.followups||[]).forEach(f=>a.push({c,f})));return a.length?a.sort((x,y)=>x.f.date.localeCompare(y.f.date)).slice(0,15).map(x=>`<div class="list"><b>${esc(x.c.name)}</b> • ${esc(x.f.date)}<br>${esc(x.f.note||'Follow-up')} <button class="btn green small" onclick="waOne('${x.c.id}')">WhatsApp</button></div>`).join(''):'<div class="empty">No follow-ups.</div>'}
function backupPage(){document.getElementById('app').innerHTML=`<section class="card"><h2>💾 Backup & Restore</h2><p>Export customers, orders, templates, exhibitions and settings as JSON.</p><div class="actions"><button class="btn green" onclick="exportData()">⬇️ Export Backup</button><label class="btn">⬆️ Import Backup<input type="file" hidden accept="application/json" onchange="importData(event)"></label></div></section><section class="card"><h3>Data Summary</h3><div class="grid3"><div><b>${DB.customers.length}</b><br><span class="muted">Customers</span></div><div><b>${allOrders().length}</b><br><span class="muted">Orders</span></div><div><b>${DB.templates.length}</b><br><span class="muted">Templates</span></div></div></section><section class="card"><h3>⚠️ Reset</h3><p class="muted">Export a backup first. Reset permanently clears this browser's app data.</p><button class="btn red" onclick="resetData()">Reset All Data</button></section>`}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(DB,null,2)],{type:'application/json'}));a.download='shree-ji-connect-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Backup downloaded ✓')}
function importData(e){let f=e.target.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.customers)||!Array.isArray(d.templates))throw Error();DB=d;save();page('dashboard');toast('Backup restored ✓')}catch(x){toast('Invalid backup file')}};r.readAsText(f)}
function resetData(){if(!confirm('Reset ALL customers, orders and templates?'))return;DB=blankDB();save();page('dashboard');toast('All data reset')}
function settingsPage(){document.getElementById('app').innerHTML=`<section class="card"><h2>⚙️ Settings</h2><div class="field"><label>Company Name</label><input id="company" value="${esc(DB.settings.company||'SHREE JI GOLD CREATOR LLP')}"></div><p class="muted">GST and Order Value are intentionally not included. Orange branding is fixed for the app.</p><button class="btn orange" onclick="saveSettings()">Save Settings</button></section><section class="card"><h3>Order Type</h3><p><b>DIRECT</b> — Our Supply</p><p><b>SM</b> — Dealer Supply</p></section>`}
function saveSettings(){DB.settings.company=company.value.trim()||'SHREE JI GOLD CREATOR LLP';save();toast('Settings saved ✓')}
function showModal(){document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeSide()}});page('dashboard');if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{}));
</script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</body></html>
